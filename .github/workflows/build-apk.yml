
name: Build Aion APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        id: find
        run: |
          if [ -f "./gradlew" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "./AionApp/gradlew" ]; then
            echo "dir=./AionApp" >> $GITHUB_OUTPUT
          else
            GRADLE_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -1)
            echo "dir=$(dirname "$GRADLE_PATH")" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: |
          cd ${{ steps.find.outputs.dir }}
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aion-APK
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: error
